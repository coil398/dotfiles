# 通常セッションは従来の sandbox_mode 方式を使用する。
# default_permissions / [permissions.*] と併記せず、権限境界は実効設定で確認する。
sandbox_mode = "danger-full-access"
# The parent owns orchestration; routine delegated work starts at Luna Max.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
# Active context budget and total-context compaction threshold (tokens).
# Children inherit these overrides, subject to their model limits.
model_context_window = 400000
model_auto_compact_token_limit = 360000
model_auto_compact_token_limit_scope = "total"
approval_policy = "never"
approvals_reviewer = "auto_review"

[auto_review]
extra_policy = """
- Treat the user's request in this conversation as authorization for the actions needed to fulfil it. The request does not need to name the exact action; acting on its evident intent is enough. Do not ask again for an action the user has already approved.
- Deny only actions whose damage cannot be undone, or that would expose secrets beyond the user's control.
- Deny any action the user has said not to take, whether in this conversation or in their standing instructions.
"""

[memories]
extract_model = "gpt-6-luna"
consolidation_model = "gpt-6.1-sol"

[agents]
enabled = true
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "high"
max_concurrent_threads_per_session = 6

[sandbox_workspace_write]
network_access = true

# Structured feature tables below require a compatible Codex runtime.
# Waiting controls are verified against codex 0.162.1; do not deploy to older incompatible clients.
[features]
hooks = true
memories = true
prevent_idle_sleep = true
fast_mode = false
ultrafast_mode = false

# Bound quiet-wait polling. These values are wait_agent timeouts, not child job deadlines.
# This opts into V2; V1 does not use these timeout controls.
# Completion, mailbox activity and user steering can still return immediately.
[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 600000
default_wait_timeout_ms = 1200000
max_wait_timeout_ms = 3600000

# Usage hints replace Codex 0.162.1's composed default text entirely, so these values carry
# that full default (concurrency 6 = [agents].max_concurrent_threads_per_session, wait_agent and
# model-override guidance) plus the fork_turns="none" rule. Re-derive them when Codex or the
# concurrency limit changes. This is guidance text, not enforcement.
root_agent_usage_hint_text = '''
You are `/root`, the primary agent in a team of agents collaborating to fulfill the user's goals.

At the start of your turn, you are the active agent.
You can spawn sub-agents to handle subtasks, and those sub-agents can spawn their own sub-agents.
All agents in the team, including the agents that you can assign tasks to, are equally intelligent and capable, and have access to the same set of tools.

You can use `spawn_agent` to create a new agent, `followup_task` to give an existing agent a new task and trigger a turn, and `send_message` to pass a message to a running agent without triggering a turn.
Child agents can also spawn their own sub-agents.
Always set `fork_turns` to `"none"` when calling `spawn_agent`. Do not omit it and do not pass `"all"` or a number; give the sub-agent the context it needs in the task message instead of forking your history.

You will receive messages in the analysis channel in the form:
```
Message Type: MESSAGE | FINAL_ANSWER
Task name: <recipient>
Sender: <author>
Payload:
<payload text>
```
They may be addressed as to=/root

Note that collaboration tools cannot be called from inside `functions.exec`. Call `spawn_agent`, `send_message`, `followup_task`, `wait_agent`, `interrupt_agent`, and `list_agents` only as direct tool calls using the recipient shown in their tool definitions, such as `to=functions.collaboration.spawn_agent`, since they are intentionally absent from the `functions.exec` `tools.*` namespace. Available tools in `functions.exec` are explicitly described with a `tools` namespace in the developer message.

All agents share the same directory. In detail:
- All agents have access to the same container and filesystem as you.
- All agents use the same current working directory.
- As a result, edits made by one agent are immediately visible to all other agents.

When calling `wait_agent`, prefer longer waits (minutes) to avoid busy polling.

There are 6 available concurrency slots, meaning that up to 6 agents can be active at once, including you.

Full-history forks (`fork_turns` omitted or `"all"`) inherit the parent model and reasoning effort and do not accept overrides. Only set `model` or `reasoning_effort` when explicitly requested by the user, applicable `AGENTS.md` instructions, or skill instructions; when doing so, set `fork_turns` to `"none"`.'''
subagent_usage_hint_text = '''
You are an agent in a team of agents collaborating to complete a task.

You can spawn sub-agents to handle subtasks, and those sub-agents can spawn their own sub-agents. All agents in the team, including the agents that you can assign tasks to, are equally intelligent and capable, and have access to the same set of tools.

You can use `spawn_agent` to create a new agent, `followup_task` to give an existing agent a new task and trigger a turn, and `send_message` to pass a message to a running agent.
Child agents can also spawn their own sub-agents.
Always set `fork_turns` to `"none"` when calling `spawn_agent`. Do not omit it and do not pass `"all"` or a number; give the sub-agent the context it needs in the task message instead of forking your history.

When you provide a response in the final channel, that content is immediately delivered back to your parent agent.

You will receive messages in the analysis channel in the form:
```
Message Type: NEW_TASK | MESSAGE | FINAL_ANSWER
Task name: <recipient>
Sender: <author>
Payload:
<payload text>
```
You may also see them addressed as to=/root/..., which indicates your identity is /root/...

Note that collaboration tools cannot be called from inside `functions.exec`. Call `spawn_agent`, `send_message`, `followup_task`, `wait_agent`, `interrupt_agent`, and `list_agents` only as direct tool calls using the recipient shown in their tool definitions, such as `to=functions.collaboration.spawn_agent`, since they are intentionally absent from the `functions.exec` `tools.*` namespace. Available tools in `functions.exec` are explicitly described with a `tools` namespace in the developer message.

All agents share the same directory. In detail:
- All agents have access to the same container and filesystem as you.
- All agents use the same current working directory.
- As a result, edits made by one agent are immediately visible to all other agents.

When calling `wait_agent`, prefer longer waits (minutes) to avoid busy polling.

There are 6 available concurrency slots, meaning that up to 6 agents can be active at once, including you.

Full-history forks (`fork_turns` omitted or `"all"`) inherit the parent model and reasoning effort and do not accept overrides. Only set `model` or `reasoning_effort` when explicitly requested by the user, applicable `AGENTS.md` instructions, or skill instructions; when doing so, set `fork_turns` to `"none"`.'''

# プロジェクト trust ([projects."<absolute path>"]) はマシン固有の絶対パスのため、
# この共有 SSOT には置かない（Mac/Linux 間で累積・混在する原因になる）。
# 各マシンの .codex/generated/config.toml（git 管理外）側に保持し、sync-codex.sh の再生成時に
# preserve_projects_toml が既存 config.toml から引き継ぐ。

[tools]
web_search = true
