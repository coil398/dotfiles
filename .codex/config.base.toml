# 通常セッションは従来の sandbox_mode 方式を使用する。
# default_permissions / [permissions.*] と併記せず、権限境界は実効設定で確認する。
sandbox_mode = "workspace-write"
# Astra is the parent/orchestrator; routine delegated work starts at Luna Max.
model = "gpt-6-astra"
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"
max_concurrent_threads_per_session = 6
max_depth = 2
job_max_runtime_seconds = 1800

[sandbox_workspace_write]
network_access = true

# Structured feature tables below require a compatible Codex runtime.
# Waiting controls are verified against codex 0.153.4; do not deploy to older incompatible clients.
[features]
hooks = true
prevent_idle_sleep = true

[features.context_management]
experimental_mode = true

# Quiet waits must not repeatedly re-enter the parent model.
# This opts into V2; V1 does not use these timeout controls.
# Completion, mailbox activity and user steering can still return immediately.
[features.multi_agent_v2]
enabled = true
min_wait_timeout_ms = 600000
default_wait_timeout_ms = 1200000
max_wait_timeout_ms = 3600000

# プロジェクト trust ([projects."<absolute path>"]) はマシン固有の絶対パスのため、
# この共有 SSOT には置かない（Mac/Linux 間で累積・混在する原因になる）。
# 各マシンの .codex/config.toml（git 管理外）側に保持し、sync-codex.sh の再生成時に
# preserve_projects_toml が既存 config.toml から引き継ぐ。

[tools]
web_search = true

[notice.model_migrations]
gpt-5-codex = "gpt-5.2-codex"

[tui.model_availability_nux]
"gpt-5.5" = 1

# Runtime-enforced history-free V2 spawns. The parent supplies the task and
# Skill/reference paths; no parent conversation is attached, even if the
# model requests all/partial history or omits fork_turns. This does not change
# model/effort, permissions, or the child's own history on a follow-up.
# Codex 0.153.4 canonicalizes native spawn_agent (also matcher alias Agent).
# Hooks must be reviewed/trusted through /hooks; never mint trust hashes.
[[hooks.PreToolUse]]
matcher = "^spawn_agent$"

[[hooks.PreToolUse.hooks]]
type = "command"
timeout = 5
command = '''python3 -I -S -c '
import json
import sys

def deny(reason):
    json.dump({"hookSpecificOutput": {
        "hookEventName": "PreToolUse",
        "permissionDecision": "deny",
        "permissionDecisionReason": reason
    }}, sys.stdout)
    raise SystemExit(0)

try:
    event = json.load(sys.stdin)
except (ValueError, TypeError):
    deny("Invalid input for the history-free subagent policy.")
if not isinstance(event, dict):
    deny("Invalid input for the history-free subagent policy.")
if event.get("hook_event_name") != "PreToolUse" or event.get("tool_name") != "spawn_agent":
    raise SystemExit(0)
args = event.get("tool_input")
if not isinstance(args, dict):
    deny("Subagent arguments must be an object.")
if not all(isinstance(args.get(key), str) and args[key].strip() for key in ("task_name", "message")):
    deny("History-free delegation requires the configured V2 interface with task_name and a self-contained message.")
args = dict(args)
args.pop("fork_context", None)
args["fork_turns"] = "none"
json.dump({"hookSpecificOutput": {
    "hookEventName": "PreToolUse",
    "permissionDecision": "allow",
    "updatedInput": args
}}, sys.stdout)
'
'''
