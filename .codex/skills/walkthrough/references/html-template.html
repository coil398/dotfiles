<!doctype html>
<!--
  walkthrough HTML template
  ------------------------------------------------------------------
  このファイルは /walkthrough の `--html` モードで使う雛形。
  生成時は本ファイルをそのままコピーし、二重波括弧のプレースホルダと
  <main> 内のコンテンツだけを差し替える。CSS / JS は編集しない。
  外部リクエストは 0 件（CDN・Web フォント・画像を追加しないこと）。

  このコメントブロックと、本文中の <!-- 例: ... --> 注記は
  生成物では削除すること。

  使い方の詳細は references/html-mode.md を参照。
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — walkthrough</title>
<style>
/* ============================================================
   1. tokens
   ============================================================ */
:root {
  --bg:        #f4f5f7;
  --surface:   #ffffff;
  --surface-2: #eceef2;
  --text:      #1b2028;
  --text-dim:  #5b6472;
  --border:    #d8dce3;
  --accent:    #a8631a;
  --accent-2:  #7d4a13;
  --accent-bg: #f6e9d6;
  --add:       #2f7d4f;
  --add-bg:    #e6f4ea;
  --del:       #b23a41;
  --del-bg:    #fbe9ea;
  --warn-bg:   #fdf3e0;
  --tok-com:   #7b8494;
  --tok-str:   #2b7f7a;
  --tok-num:   #7a4fb5;
  --tok-kw:    #a8631a;
  --tok-fn:    #2f5fa8;

  --ff-mono: "Cica", "SFMono-Regular", "SF Mono", Menlo, Consolas, "Ricty Diminished", "Noto Sans Mono CJK JP", monospace;
  --ff-body: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", system-ui, -apple-system, sans-serif;

  --fs-display: clamp(1.85rem, 1.15rem + 2.3vw, 2.75rem);
  --fs-h2:      clamp(1.3rem, 1.05rem + 0.8vw, 1.6rem);
  --fs-h3:      1.06rem;
  --fs-body:    0.97rem;
  --fs-code:    0.845rem;
  --fs-meta:    0.735rem;

  --rail-x: 1.55rem;
  --col:    78ch;
  --radius: 5px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0f1319;
    --surface:   #161b24;
    --surface-2: #1d2430;
    --text:      #dfe4ec;
    --text-dim:  #8b95a6;
    --border:    #262e3b;
    --accent:    #e0a458;
    --accent-2:  #f0bd7c;
    --accent-bg: #2f2517;
    --add:       #6cc08b;
    --add-bg:    #16301f;
    --del:       #f07a80;
    --del-bg:    #33191b;
    --warn-bg:   #2b2213;
    --tok-com:   #6b7688;
    --tok-str:   #7fd6cf;
    --tok-num:   #c3a2ec;
    --tok-kw:    #e0a458;
    --tok-fn:    #86b6f0;
  }
}
:root[data-theme="dark"] {
  --bg:        #0f1319;
  --surface:   #161b24;
  --surface-2: #1d2430;
  --text:      #dfe4ec;
  --text-dim:  #8b95a6;
  --border:    #262e3b;
  --accent:    #e0a458;
  --accent-2:  #f0bd7c;
  --accent-bg: #2f2517;
  --add:       #6cc08b;
  --add-bg:    #16301f;
  --del:       #f07a80;
  --del-bg:    #33191b;
  --warn-bg:   #2b2213;
  --tok-com:   #6b7688;
  --tok-str:   #7fd6cf;
  --tok-num:   #c3a2ec;
  --tok-kw:    #e0a458;
  --tok-fn:    #86b6f0;
}

/* ============================================================
   2. base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 1.5rem; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--ff-body);
  font-size: var(--fs-body);
  line-height: 1.85;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

/* ============================================================
   3. shell / sidebar
   ============================================================ */
.wt-shell { display: grid; grid-template-columns: 16rem minmax(0, 1fr); gap: 0; }

.wt-nav {
  position: sticky; top: 0; align-self: start;
  height: 100vh; overflow-y: auto;
  padding: 1.6rem 1rem 2rem 1.4rem;
  border-right: 1px solid var(--border);
  background: var(--surface);
  font-size: var(--fs-meta);
}
.wt-nav-brand {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  letter-spacing: .16em; text-transform: uppercase;
  color: var(--text-dim); margin-bottom: 1.1rem;
}
.wt-nav ol { list-style: none; margin: 0; padding: 0; }
.wt-nav li { margin: 0; }
.wt-nav a {
  display: block; padding: .3rem .5rem .3rem .7rem;
  color: var(--text-dim); text-decoration: none;
  border-left: 2px solid transparent; line-height: 1.5;
}
.wt-nav a:hover { color: var(--text); background: var(--surface-2); }
.wt-nav a.is-current { color: var(--accent); border-left-color: var(--accent); background: var(--accent-bg); }
.wt-nav .lv3 { padding-left: 1.5rem; font-family: var(--ff-mono); }
.wt-nav-foot { margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--border); }
.wt-theme {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  background: none; border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text-dim); padding: .3rem .6rem; cursor: pointer;
}
.wt-theme:hover { color: var(--text); border-color: var(--text-dim); }

.wt-main { padding: 2.6rem clamp(1.1rem, 4vw, 3.4rem) 6rem; min-width: 0; }
.wt-main > * { max-width: var(--col); }

/* ============================================================
   4. header
   ============================================================ */
.wt-head { margin-bottom: 2.6rem; }
.wt-eyebrow {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  letter-spacing: .18em; text-transform: uppercase; color: var(--accent);
  margin: 0 0 .5rem;
}
.wt-title {
  font-family: var(--ff-mono); font-size: var(--fs-display);
  font-weight: 600; letter-spacing: -.02em; line-height: 1.25;
  margin: 0 0 1rem; overflow-wrap: anywhere;
}
.wt-chips { display: flex; flex-wrap: wrap; gap: .4rem; margin: 0; padding: 0; list-style: none; }
.wt-chips li {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  color: var(--text-dim); background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: .18rem .55rem; line-height: 1.7;
}
.wt-chips b { color: var(--text); font-weight: 600; }

/* ============================================================
   5. typography
   ============================================================ */
.wt-main h2 {
  font-family: var(--ff-mono); font-size: var(--fs-h2); font-weight: 600;
  letter-spacing: -.01em; margin: 3.2rem 0 1rem;
  padding-bottom: .4rem; border-bottom: 1px solid var(--border);
}
.wt-main h3 { font-size: var(--fs-h3); font-weight: 700; margin: 1.8rem 0 .6rem; }
.wt-main p { margin: 0 0 1rem; }
.wt-main ul, .wt-main ol { margin: 0 0 1rem; padding-left: 1.4rem; }
.wt-main li { margin-bottom: .35rem; }
.wt-lead { font-size: 1.03rem; color: var(--text); }
code:not(pre code) {
  font-family: var(--ff-mono); font-size: .88em;
  background: var(--surface-2); border-radius: 3px; padding: .1em .35em;
  overflow-wrap: anywhere;
}

/* ============================================================
   6. rail (signature) — 読む順序をコードの gutter として見せる
   ============================================================ */
.wt-rail { position: relative; list-style: none; margin: 1.4rem 0 0; padding: 0; }
.wt-rail::before {
  content: ""; position: absolute; left: var(--rail-x); top: .5rem; bottom: .5rem;
  width: 1px; background: var(--border);
  transform-origin: top; animation: railDraw .7s ease-out both;
}
@keyframes railDraw { from { transform: scaleY(0); } to { transform: scaleY(1); } }
.wt-rail-fill {
  position: absolute; left: var(--rail-x); top: .5rem; width: 1px; height: 0;
  background: var(--accent); transition: height .18s linear;
}
.wt-step { position: relative; padding: 0 0 2.2rem 3.4rem; margin: 0; }
.wt-step-mark {
  position: absolute; left: 0; top: .05rem; width: 2.3rem;
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  text-align: right; color: var(--text-dim);
  background: var(--bg); padding: .1rem .35rem .1rem 0;
}
.wt-step-mark::after {
  content: ""; position: absolute; right: -.42rem; top: .62rem;
  width: .5rem; height: .5rem; border-radius: 50%;
  background: var(--bg); border: 1px solid var(--border);
}
.wt-step.is-active .wt-step-mark { color: var(--accent); font-weight: 700; }
.wt-step.is-active .wt-step-mark::after { background: var(--accent); border-color: var(--accent); }
.wt-step h3 { margin-top: 0; }
.wt-step-path {
  display: inline-block; font-family: var(--ff-mono); font-size: var(--fs-meta);
  color: var(--text-dim); background: var(--surface-2);
  border-radius: var(--radius); padding: .05rem .45rem; margin-bottom: .3rem;
  overflow-wrap: anywhere;
}

/* ============================================================
   7. code
   ============================================================ */
.wt-code {
  margin: 1rem 0 1.4rem; border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
}
.wt-code figcaption {
  display: flex; align-items: center; gap: .6rem;
  padding: .35rem .7rem; border-bottom: 1px solid var(--border);
  background: var(--surface-2);
  font-family: var(--ff-mono); font-size: var(--fs-meta); color: var(--text-dim);
}
.wt-code figcaption .wt-path { color: var(--text); overflow-wrap: anywhere; }
.wt-code figcaption .wt-spacer { margin-left: auto; }
.wt-copy {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  background: none; border: 1px solid var(--border); border-radius: 3px;
  color: var(--text-dim); padding: .05rem .45rem; cursor: pointer; white-space: nowrap;
}
.wt-copy:hover { color: var(--text); border-color: var(--text-dim); }
.wt-code pre {
  margin: 0; padding: .7rem 0; overflow-x: auto;
  font-family: var(--ff-mono); font-size: var(--fs-code); line-height: 1.65;
  tab-size: 2;
}
.wt-code code { font-family: inherit; }
.wt-ln { display: block; padding: 0 .9rem 0 0; white-space: pre; }
.wt-ln::before {
  content: attr(data-n);
  display: inline-block; width: 3.1rem; padding-right: .9rem;
  text-align: right; color: var(--text-dim); opacity: .55;
  user-select: none; -webkit-user-select: none;
}
.wt-ln.add { background: var(--add-bg); }
.wt-ln.add::before { color: var(--add); opacity: .9; }
.wt-ln.del { background: var(--del-bg); }
.wt-ln.del::before { color: var(--del); opacity: .9; }
.wt-ln.mark { background: var(--accent-bg); box-shadow: inset 2px 0 0 var(--accent); }
.tok-com { color: var(--tok-com); font-style: italic; }
.tok-str { color: var(--tok-str); }
.tok-num { color: var(--tok-num); }
.tok-kw  { color: var(--tok-kw); }
.tok-fn  { color: var(--tok-fn); }

/* ============================================================
   8. callouts / table / flow / details
   ============================================================ */
.wt-note {
  border: 1px solid var(--border); border-left: 3px solid var(--text-dim);
  border-radius: var(--radius); background: var(--surface);
  padding: .8rem 1rem; margin: 1rem 0;
}
.wt-note > :last-child { margin-bottom: 0; }
.wt-note-label {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  letter-spacing: .1em; text-transform: uppercase; color: var(--text-dim);
  display: block; margin-bottom: .3rem;
}
.wt-note.trap { border-left-color: var(--accent); background: var(--warn-bg); }
.wt-note.trap .wt-note-label { color: var(--accent-2); }
.wt-note.danger { border-left-color: var(--del); background: var(--del-bg); }
.wt-note.danger .wt-note-label { color: var(--del); }

.wt-table-wrap { overflow-x: auto; margin: 1rem 0 1.4rem; }
.wt-table { border-collapse: collapse; width: 100%; font-size: .92em; }
.wt-table th, .wt-table td {
  border: 1px solid var(--border); padding: .45rem .7rem;
  text-align: left; vertical-align: top; line-height: 1.6;
}
.wt-table th {
  background: var(--surface-2); font-family: var(--ff-mono);
  font-size: var(--fs-meta); letter-spacing: .04em; white-space: nowrap;
}
.wt-table code { white-space: nowrap; }

.wt-flow {
  display: flex; flex-wrap: wrap; align-items: stretch; gap: .5rem;
  margin: 1.2rem 0 1.6rem;
}
.wt-flow.vertical { flex-direction: column; align-items: flex-start; }
.wt-node {
  flex: 0 1 auto; min-width: 7rem;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: .45rem .7rem;
  font-family: var(--ff-mono); font-size: var(--fs-meta); line-height: 1.55;
}
.wt-node.accent { border-color: var(--accent); color: var(--accent-2); background: var(--accent-bg); }
.wt-node small { display: block; color: var(--text-dim); font-size: .92em; }
.wt-arrow {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  color: var(--text-dim); font-family: var(--ff-mono); font-size: var(--fs-meta);
  padding: 0 .1rem; white-space: nowrap;
}
.wt-arrow::before { content: "→"; font-size: 1.05rem; line-height: 1; }
.wt-flow.vertical .wt-arrow::before { content: "↓"; }
.wt-svg { display: block; max-width: 100%; height: auto; margin: 1.2rem 0 1.6rem; color: var(--text-dim); }
.wt-svg text { font-family: var(--ff-mono); font-size: 11px; fill: var(--text); }

details.wt-fold {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); padding: .5rem .9rem; margin: 1rem 0;
}
details.wt-fold > summary {
  cursor: pointer; font-family: var(--ff-mono); font-size: var(--fs-meta);
  color: var(--text-dim); list-style-position: outside;
}
details.wt-fold[open] > summary { color: var(--text); margin-bottom: .6rem; }

/* ============================================================
   9. menu / log
   ============================================================ */
.wt-menu-form { margin: 0; }
.wt-menu { list-style: none; margin: 1rem 0; padding: 0; display: grid; gap: .5rem; }
.wt-menu li {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); margin: 0;
}
.wt-menu li:has(input:checked) { border-color: var(--accent); background: var(--accent-bg); }
.wt-menu label {
  display: grid; grid-template-columns: 1.1rem 1.7rem minmax(0, 1fr);
  gap: .5rem; align-items: start; padding: .55rem .8rem; cursor: pointer;
}
.wt-menu input[type="checkbox"] { margin: .45rem 0 0; accent-color: var(--accent); }
.wt-menu .key {
  font-family: var(--ff-mono); font-weight: 700; color: var(--accent);
  font-size: var(--fs-meta); line-height: 1.9;
}
.wt-menu b { display: block; font-weight: 700; }
.wt-menu .desc { color: var(--text-dim); font-size: .93em; line-height: 1.7; }
.wt-menu-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .8rem; }
.wt-menu-free {
  flex: 1 1 14rem; min-width: 0;
  font-family: var(--ff-body); font-size: var(--fs-meta);
  background: var(--surface); color: var(--text);
  border: 1px solid var(--border); border-radius: var(--radius); padding: .35rem .6rem;
}
.wt-menu-copy {
  font-family: var(--ff-mono); font-size: var(--fs-meta);
  background: var(--accent-bg); color: var(--accent-2);
  border: 1px solid var(--accent); border-radius: var(--radius);
  padding: .35rem .7rem; cursor: pointer; white-space: nowrap;
}
.wt-menu-copy:hover { background: var(--accent); color: var(--surface); }
.wt-menu-out {
  flex: 1 1 100%; font-family: var(--ff-mono); font-size: var(--fs-meta);
  color: var(--text-dim); overflow-wrap: anywhere;
}

.wt-log-entry { border-top: 1px solid var(--border); padding-top: 1.2rem; margin-top: 1.6rem; }
.wt-log-meta {
  font-family: var(--ff-mono); font-size: var(--fs-meta); color: var(--text-dim);
  margin: 0 0 .4rem;
}

.wt-foot {
  margin-top: 4rem; padding-top: 1rem; border-top: 1px solid var(--border);
  font-family: var(--ff-mono); font-size: var(--fs-meta); color: var(--text-dim);
}

/* ============================================================
   10. responsive / motion / print
   ============================================================ */
@media (max-width: 900px) {
  .wt-shell { grid-template-columns: minmax(0, 1fr); }
  .wt-nav {
    position: static; height: auto; max-height: 55vh;
    border-right: none; border-bottom: 1px solid var(--border);
    padding: 1rem 1.1rem;
  }
  .wt-main { padding-top: 1.8rem; }
  .wt-flow { flex-direction: column; align-items: flex-start; }
  .wt-arrow::before { content: "↓"; }
  .wt-ln::before { width: 2.2rem; padding-right: .6rem; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media print {
  .wt-nav, .wt-copy, .wt-menu-bar, .wt-menu input[type="checkbox"] { display: none; }
  .wt-shell { display: block; }
  .wt-main { padding: 0; }
  details.wt-fold { border: none; }
  details.wt-fold > summary { display: none; }
}
</style>
</head>
<body>
<div class="wt-shell">

<!-- ===== sidebar: h2/h3 から生成した目次。id は本文と一致させる ===== -->
<aside class="wt-nav" aria-label="目次">
  <p class="wt-nav-brand">walkthrough</p>
  <nav>
    <ol>
      {{TOC}}
      <!-- 例:
      <li><a href="#overview">変更の全体像</a></li>
      <li><a href="#order">読む順序</a></li>
      <li><a class="lv3" href="#step-1">1. handler.go</a></li>
      -->
    </ol>
  </nav>
  <div class="wt-nav-foot">
    <button class="wt-theme" type="button" data-theme-toggle aria-live="polite">theme: auto</button>
  </div>
</aside>

<main class="wt-main">

  <header class="wt-head">
    <p class="wt-eyebrow">{{MODE}} / {{WORK_MODE}}</p>
    <h1 class="wt-title">{{TITLE}}</h1>
    <ul class="wt-chips">
      {{CHIPS}}
      <!-- 例: <li>target <b>#123</b></li><li>規模 <b>18 files / +742 -196</b></li><li>生成 <b>2026-07-30 14:02</b></li> -->
    </ul>
  </header>

  {{CONTENT}}

  <footer class="wt-foot">
    <p>md 版: {{MD_PATH}} ／ 生成: {{GENERATED_AT}}</p>
  </footer>

</main>
</div>

<script>
(function () {
  "use strict";

  /* ---------- theme ---------- */
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem("wt-theme"); } catch (e) {}
  if (saved === "light" || saved === "dark") root.setAttribute("data-theme", saved);
  var btn = document.querySelector("[data-theme-toggle]");
  function label() {
    var t = root.getAttribute("data-theme");
    if (btn) btn.textContent = "theme: " + (t || "auto");
  }
  label();
  if (btn) {
    btn.addEventListener("click", function () {
      var order = ["auto", "light", "dark"];
      var cur = root.getAttribute("data-theme") || "auto";
      var next = order[(order.indexOf(cur) + 1) % order.length];
      if (next === "auto") root.removeAttribute("data-theme");
      else root.setAttribute("data-theme", next);
      try { localStorage.setItem("wt-theme", next); } catch (e) {}
      label();
    });
  }

  /* ---------- clipboard（コードブロックと詳細化メニューで共用） ---------- */
  function copyText(text, done, fail) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fail);
      return;
    }
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    if (ok) done(); else fail();
  }

  /* ---------- syntax highlighting ---------- */
  var COMMON = "if else for while return break continue switch case default new null true false";
  var LANGS = {
    js:     { c: "slash", kw: "const let var function class extends implements import export from as async await try catch finally throw typeof instanceof of in yield static get set delete void this super" },
    jsx:    { alias: "js" }, ts: { alias: "js" }, tsx: { alias: "js" },
    go:     { c: "slash", kw: "func package import type struct interface map chan go defer range var const nil select fallthrough error string int bool byte rune" },
    rust:   { c: "slash", kw: "fn let mut struct enum impl trait pub use mod match crate self Some None Ok Err where dyn ref move unsafe impl loop as" },
    java:   { c: "slash", kw: "public private protected class interface extends implements static final void import package new try catch finally throw throws this super int long boolean String" },
    kotlin: { c: "slash", kw: "fun val var class object interface data sealed when import package suspend override private internal companion is as" },
    swift:  { c: "slash", kw: "func let var struct class enum protocol extension import guard defer where some any throws try catch init self" },
    c:      { c: "slash", kw: "int char void struct typedef const static unsigned long short sizeof include define return goto" },
    cpp:    { alias: "c" }, cs: { alias: "java" },
    php:    { c: "both",  kw: "function class public private protected static namespace use echo require include foreach as new array null" },
    py:     { c: "hash",  kw: "def class import from as pass lambda None True False and or not with yield global nonlocal raise except elif is del assert async await try finally" },
    python: { alias: "py" }, rb: { c: "hash", kw: "def class module end require do unless elsif then yield attr_accessor nil self" },
    ruby:   { alias: "rb" },
    sh:     { c: "hash",  kw: "if then fi elif else for do done while until case esac function local export readonly return echo set shift" },
    bash:   { alias: "sh" }, zsh: { alias: "sh" },
    yaml:   { c: "hash",  kw: "" }, yml: { alias: "yaml" }, toml: { c: "hash", kw: "" },
    sql:    { c: "dash",  kw: "select from where join left right inner outer on group by order having limit insert into values update set delete create table alter index as and or not null" },
    lua:    { c: "dash",  kw: "function local end then elseif nil require repeat until" },
    css:    { c: "block", kw: "" }, scss: { alias: "css" },
    html:   { c: "html",  kw: "" }, xml: { alias: "html" },
    json:   { c: "none",  kw: "" }, diff: { c: "none", kw: "" }, md: { c: "none", kw: "" }
  };
  var COMMENTS = {
    slash: "\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*",
    hash:  "#[^\\n]*",
    both:  "\\/\\*[\\s\\S]*?\\*\\/|\\/\\/[^\\n]*|#[^\\n]*",
    dash:  "\\/\\*[\\s\\S]*?\\*\\/|--[^\\n]*",
    block: "\\/\\*[\\s\\S]*?\\*\\/",
    html:  "&lt;!--[\\s\\S]*?--&gt;",
    none:  null
  };
  function resolve(name) {
    var cfg = LANGS[(name || "").toLowerCase()];
    if (cfg && cfg.alias) cfg = LANGS[cfg.alias];
    return cfg || null;
  }
  function buildRe(cfg) {
    var parts = [];
    var com = cfg ? COMMENTS[cfg.c] : null;
    parts.push(com ? "(" + com + ")" : "(\\u0000)");
    parts.push("(\"(?:\\\\.|[^\"\\\\\\n])*\"|'(?:\\\\.|[^'\\\\\\n])*'|`(?:\\\\.|[^`\\\\])*`)");
    parts.push("(\\b0[xX][0-9a-fA-F]+\\b|\\b\\d+(?:\\.\\d+)?\\b)");
    parts.push("([A-Za-z_$][A-Za-z0-9_$]*)");
    return new RegExp(parts.join("|"), "g");
  }
  function highlight(escaped, langName) {
    var cfg = resolve(langName);
    if (cfg && cfg.c === "none" && !cfg.kw) return escaped;
    var kws = {};
    (COMMON + " " + (cfg && cfg.kw ? cfg.kw : "")).split(/\s+/).forEach(function (w) { if (w) kws[w] = 1; });
    var re = buildRe(cfg);
    return escaped.replace(re, function (m, com, str, num, word, off, whole) {
      if (com) return '<span class="tok-com">' + com + "</span>";
      if (str) return '<span class="tok-str">' + str + "</span>";
      if (num) return '<span class="tok-num">' + num + "</span>";
      if (word) {
        if (kws[word]) return '<span class="tok-kw">' + word + "</span>";
        if (whole.charAt(off + word.length) === "(") return '<span class="tok-fn">' + word + "</span>";
      }
      return m;
    });
  }

  /* ---------- code blocks: escape → highlight → line numbers ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function parseMarks(spec) {
    var set = {};
    (spec || "").split(",").forEach(function (chunk) {
      chunk = chunk.trim();
      if (!chunk) return;
      var m = chunk.match(/^(\d+)-(\d+)$/);
      if (m) { for (var i = +m[1]; i <= +m[2]; i++) set[i] = 1; }
      else if (/^\d+$/.test(chunk)) set[+chunk] = 1;
    });
    return set;
  }
  document.querySelectorAll(".wt-code").forEach(function (fig) {
    var codeEl = fig.querySelector("pre > code");
    if (!codeEl) return;
    var lang = fig.getAttribute("data-lang") || "";
    var isDiff = fig.hasAttribute("data-diff") || lang === "diff";
    var start = parseInt(fig.getAttribute("data-start") || "1", 10);
    var marks = parseMarks(fig.getAttribute("data-mark"));
    var raw = codeEl.textContent.replace(/\n$/, "");
    var out = raw.split("\n").map(function (line, i) {
      var n = start + i;
      var cls = "wt-ln";
      var body = line;
      if (isDiff) {
        if (line.charAt(0) === "+") cls += " add";
        else if (line.charAt(0) === "-") cls += " del";
      }
      if (marks[n]) cls += " mark";
      var html = highlight(esc(body), lang);
      return '<span class="' + cls + '" data-n="' + n + '">' + (html || " ") + "</span>";
    }).join("");
    codeEl.innerHTML = out;

    var cap = fig.querySelector("figcaption");
    if (cap && !cap.querySelector(".wt-copy")) {
      var sp = document.createElement("span");
      sp.className = "wt-spacer";
      var b = document.createElement("button");
      b.type = "button";
      b.className = "wt-copy";
      b.textContent = "copy";
      b.addEventListener("click", function () {
        copyText(raw, function () {
          b.textContent = "copied";
          setTimeout(function () { b.textContent = "copy"; }, 1400);
        }, function () {
          b.textContent = "failed";
        });
      });
      cap.appendChild(sp);
      cap.appendChild(b);
    }
  });

  /* ---------- detail menu → プロンプト文字列 ---------- */
  document.querySelectorAll(".wt-menu-form").forEach(function (form) {
    var btn = form.querySelector(".wt-menu-copy");
    if (!btn) return;
    var free = form.querySelector(".wt-menu-free");
    var out = form.querySelector(".wt-menu-out");
    function say(msg) { if (out) out.textContent = msg; }
    form.addEventListener("submit", function (e) { e.preventDefault(); });
    btn.addEventListener("click", function () {
      var keys = [];
      form.querySelectorAll('input[type="checkbox"]:checked').forEach(function (c) {
        keys.push(c.value);
      });
      var extra = free && free.value.trim() ? free.value.trim() : "";
      var parts = [];
      if (keys.length) parts.push(keys.join(", "));
      if (extra) parts.push(extra);
      if (!parts.length) {
        say("項目を選ぶか、自由入力を書いてから押してください");
        return;
      }
      var text = parts.join(" / ") + " を詳しく";
      copyText(text, function () {
        say("コピーしました → " + text);
      }, function () {
        say("コピーに失敗。手で入力してください: " + text);
      });
    });
  });

  /* ---------- toc current section ---------- */
  var links = {};
  document.querySelectorAll(".wt-nav a[href^='#']").forEach(function (a) {
    links[a.getAttribute("href").slice(1)] = a;
  });
  var targets = Object.keys(links)
    .map(function (id) { return document.getElementById(id); })
    .filter(Boolean);
  if (targets.length && "IntersectionObserver" in window) {
    var visible = {};
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { visible[e.target.id] = e.isIntersecting; });
      var current = null;
      for (var i = 0; i < targets.length; i++) {
        if (visible[targets[i].id]) { current = targets[i].id; break; }
      }
      if (!current) return;
      Object.keys(links).forEach(function (id) {
        links[id].classList.toggle("is-current", id === current);
      });
    }, { rootMargin: "-8% 0px -70% 0px" });
    targets.forEach(function (t) { io.observe(t); });
  }

  /* ---------- rail progress ---------- */
  document.querySelectorAll(".wt-rail").forEach(function (rail) {
    var fill = rail.querySelector(".wt-rail-fill");
    if (!fill) {
      fill = document.createElement("div");
      fill.className = "wt-rail-fill";
      rail.insertBefore(fill, rail.firstChild);
    }
    var steps = Array.prototype.slice.call(rail.querySelectorAll(".wt-step"));
    if (!steps.length) return;
    var ticking = false;
    function update() {
      ticking = false;
      var line = window.innerHeight * 0.4;
      var railTop = rail.getBoundingClientRect().top;
      // アクティブは常に 1 つ。読み込み位置を最後に通過したステップだけが持つ。
      var last = null;
      steps.forEach(function (s) {
        if (s.getBoundingClientRect().top <= line) last = s;
      });
      steps.forEach(function (s) {
        s.classList.toggle("is-active", s === last);
      });
      var h = last ? (last.getBoundingClientRect().top - railTop) + 12 : 0;
      fill.style.height = Math.max(0, h) + "px";
    }
    function onScroll() {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(update);
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    update();
  });
})();
</script>
</body>
</html>
