# Command Code (hand-declared route)。keyは環境変数 COMMANDCODE_API_KEY で渡す。
# baseURLは公式の https://api.commandcode.ai/provider/v1（/chat/completions、/messages、/models）。
# GOATプランのkeyでProvider APIを使える（model id deepseek/deepseek-v4.1-flash で実測）。
- id: llm-pi-ai
  config:
    providers:
      commandcode:
        displayName: Command Code
        apiKeyEnv: COMMANDCODE_API_KEY
        api: openai-completions
        baseURL: https://api.commandcode.ai/provider/v1
        compat:
          thinkingFormat: deepseek
        models:
          - id: deepseek/deepseek-v4.1-flash
            contextWindow: 1000000
            reasoningEfforts:
              low: low
              high: high
              max: max
